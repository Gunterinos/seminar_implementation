<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DimBridge</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script defer src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DimBridge Predicate Explanation Tool</h1>

  <div class="center-container">

    <div style="margin: 20px 0; display: flex; align-items: center; gap: 24px;">
      <label for="dataset-select" style="font-weight: 500; color: #2a3f5f;">Dataset:</label>
      <select id="dataset-select" style="font-size: 1rem; padding: 4px 12px; border-radius: 6px; border: 1px solid #bbb;">
        <option value="animals5">animals5</option>
        <option value="gait2">gait2</option>
      </select>
      
      <label for="stepInput" style="margin-left: 32px;">Train step:</label>
      <input type="number" id="stepInput" min="1" max="1000" value="1000" style="width: 70px; margin: 0 12px; font-size: 1rem; padding: 2px 8px; border-radius: 6px; border: 1px solid #bbb;">
      <input type="range" id="mySlider" min="1" max="1000" value="1000">
    </div>

    <span id="attribute-checkboxes" style="display: flex; align-items: center; gap: 12px;"></span>

    <div class="flex-row">
      <div id="scatter" style="width: 800px; height: 600px; position: relative;">
        <div id="scatter-title" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: 600; color: #2a3f5f; z-index: 2; background: #fff; padding: 4px 16px; border-radius: 8px; box-shadow: 0 1px 6px rgba(44,62,80,0.05); pointer-events: none;">Projection View</div>
      </div>
      <div id="barplot" style="width: 400px; height: 600px; position: relative;">
        <div id="barplot-title">Predicate Clauses</div>
      </div>
    </div>

    <label class="toggle-switch">
      <input type="checkbox" id="toggle-checkbox">
      <span class="slider"></span>
      <span class="toggle-label" id="toggle-label">Confusion Matrix (Off)</span>
    </label>
    <button id="submit">Submit Brush</button>
    <pre id="output"></pre>
  </div>
</body>
</html>
