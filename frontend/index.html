<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DimBridge</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script defer src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DimBridge Predicate Explanation Tool</h1>

  <div class="center-container">

    <div style="margin: 20px 0;">
        <label for="mySlider">Train step: <span id="sliderValue">1000</span></label>
        <input type="range" id="mySlider" min="1" max="1000" value="1000">
    </div>

    <div class="flex-row">
      <div id="scatter-container" style="display: flex; flex-direction: column; align-items: center; width: 800px; background: #fff; box-shadow: 0 2px 12px rgba(44,62,80,0.08); border-radius: 12px; padding: 12px; position: relative;">
        <div id="scatter-title" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: 600; color: #2a3f5f; z-index: 2; background: #fff; padding: 4px 16px; border-radius: 8px; box-shadow: 0 1px 6px rgba(44,62,80,0.05); pointer-events: none;">Projection View</div>
        <div id="scatter" style="width: 800px; height: 600px;"></div>
      </div>
      <div id="barplot" style="width: 400px; height: 600px; position: relative;">
        <div id="barplot-title">Predicate Clauses</div>
      </div>
    </div>

    <label class="toggle-switch">
      <input type="checkbox" id="toggle-checkbox">
      <span class="slider"></span>
      <span class="toggle-label" id="toggle-label">Confusion Matrix (Off)</span>
    </label>
    <button id="submit">Submit Brush</button>
    <pre id="output"></pre>
  </div>
</body>
</html>
